<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 630px;
    background: #faf6f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    color: #3e2723;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 96px;
    overflow: hidden;
  }

  /* Same boxed monogram as the site logo and favicon. */
  .logo {
    font-size: 34px;
    font-weight: 700;
    letter-spacing: 0.05em;
    border: 4px solid #3e2723;
    padding: 10px 18px;
    align-self: flex-start;
    line-height: 1;
    margin-bottom: 56px;
  }

  h1 {
    font-size: 82px;
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.1;
    margin-bottom: 30px;
  }

  /* Echoes .hero-label::after on the site. */
  .rule {
    width: 64px;
    height: 3px;
    background: #d7ccc8;
    margin-bottom: 30px;
  }

  p {
    font-size: 31px;
    line-height: 1.5;
    color: #5d4037;
    max-width: 880px;
  }

  .url {
    position: absolute;
    bottom: 56px;
    left: 96px;
    font-size: 23px;
    color: #8d6e63;
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>
  <div class="logo">VC</div>
  <h1>vivek chinimilli</h1>
  <div class="rule"></div>
  <p>product &amp; strategy analyst — risk models, cash advance<br>analytics, and how fintech products behave at scale.</p>
  <div class="url">vivekc21.github.io</div>
</body>
</html>
